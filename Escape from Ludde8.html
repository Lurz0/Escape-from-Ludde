<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludde Runner</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 50% 0%,#243654 0,#121b2d 48%,#090e18 100%);color:#f1f5f9;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;overflow:hidden}
  .game{width:min(94vw,940px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:clamp(14px,2vw,28px);border:1px solid #ffffff17;border-radius:24px;background:linear-gradient(145deg,#182438eF,#111827f5);box-shadow:0 24px 80px #0008,inset 0 1px #ffffff12}.hud{display:flex;justify-content:space-between;align-items:center;font-weight:750;margin:0 2px 12px;color:#e2e8f0;letter-spacing:.02em}.hud span:first-child{font-size:1.05rem}.hud span:last-child{min-width:92px;padding:8px 14px;border:1px solid #ffffff17;border-radius:12px;background:#0b1220;color:#a7f3d0;font-variant-numeric:tabular-nums;letter-spacing:.12em}
  .arena{position:relative;width:100%}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 290px);min-height:180px;border:1px solid #52627c;border-radius:16px;background:#172033;image-rendering:pixelated;box-shadow:0 10px 30px #0007,0 0 0 5px #ffffff05;aspect-ratio:3/1}#message{position:absolute;top:14px;right:14px;z-index:2;max-width:min(390px,calc(100% - 28px));margin:0;padding:11px 16px;border:1px solid #ffffff30;border-radius:14px;background:linear-gradient(135deg,#0f172add,#1e293bcc);color:#f8fafc;font-size:clamp(.78rem,2vw,.95rem);font-weight:650;line-height:1.4;text-align:left;box-shadow:0 8px 24px #0006;backdrop-filter:blur(12px);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s}#message.visible{opacity:1;transform:translateY(0)}
  p{color:#9cadc5}.customize{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center;margin:18px 0;color:#cbd5e1;font-size:.9rem}.customize label{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid #ffffff16;border-radius:12px;background:#ffffff08}input,select{background:#121c2d;color:#fff;border:1px solid #40516b;border-radius:8px;padding:7px}input[type=color]{width:38px;height:32px;padding:3px;cursor:pointer}select{cursor:pointer}button{padding:11px 23px;border:1px solid #93c5fd55;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;cursor:pointer;font-size:1rem;font-weight:700;box-shadow:0 6px 18px #2563eb44;transition:transform .15s,filter .15s,box-shadow .15s}button:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 9px 24px #2563eb66}button:active{transform:translateY(0)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #67e8f9;outline-offset:3px}#message{min-height:1.4em;margin:16px 0 12px;font-weight:550}#scores{margin:22px auto 0;padding:14px 20px;max-width:420px;border:1px solid #ffffff16;border-radius:14px;background:#ffffff06;text-align:left}#scores h3{margin:0 0 8px;color:#e2e8f0}#scores p{font-size:.86rem}#scoreList{padding-left:24px;color:#cbd5e1}#scoreList li{padding:3px 0}
  @media(max-width:560px){body{padding:14px 10px}.game{width:100%;padding:16px 12px;border-radius:18px}.hud{margin-bottom:12px}.customize{gap:8px}.customize label{padding:7px 9px}}
  .skin-shop{margin:18px auto;padding:14px 16px;max-width:560px;border:1px solid #ffffff16;border-radius:14px;background:#ffffff06;color:#cbd5e1}.skin-shop h3{margin:0 0 10px;color:#e2e8f0}.skin-options{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.skin-options button{padding:8px 12px;font-size:.88rem}.skin-options button.selected{outline:2px solid #67e8f9;outline-offset:2px}.skin-options button:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.6)}
</style>
</head>
<body>
<main class="game">
  <div class="hud"><span>Escape from Ludde</span><span id="score">0</span></div>
  <div class="arena"><canvas id="screen" width="900" height="300" aria-label="Ludde Runner game"></canvas><div id="message" role="status" aria-live="polite"></div></div>
  <div class="customize"><label>Suit <input id="suit" type="color" value="#2563eb"></label><label>Hat <select id="hat"><option value="none">No hat</option><option value="cap">Cap</option><option value="helmet">Helmet</option></select></label></div>
  <section class="skin-shop" aria-label="Skin shop"><h3>Character skins</h3><div class="skin-options" id="skinOptions"></div><p>All skins are free!</p></section>
  <button id="restart">Start game</button>
  <div id="scores" hidden><h3>Global leaderboard</h3><p id="leaderboardStatus" aria-live="polite">Loading scores…</p><label for="playerName">Your name</label> <input id="playerName" type="text" maxlength="24" placeholder="Enter your name"><ol id="scoreList"></ol></div>
</main>
<script>
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),msg=document.querySelector('#message'),restart=document.querySelector('#restart'),suit=document.querySelector('#suit'),hat=document.querySelector('#hat'),scoresBox=document.querySelector('#scores'),scoreList=document.querySelector('#scoreList'),leaderboardStatus=document.querySelector('#leaderboardStatus'),playerName=document.querySelector('#playerName'),skinOptions=document.querySelector('#skinOptions');
const skins=[{name:'Blue',color:'#2563eb'},{name:'Ruby',color:'#dc2626'},{name:'Emerald',color:'#16a34a'},{name:'Sunshine',color:'#f59e0b'},{name:'Violet',color:'#9333ea'},{name:'Robber',color:'#111827',unlockMs:600000}];
let playtime=Number(localStorage.getItem('luddePlaytime')||0),playSessionStart=0;
function updateSkinShop(){const robber=skinOptions.querySelector('[data-name="Robber"]');if(!robber)return;const elapsed=playtime+(playing?performance.now()-playSessionStart:0),unlocked=elapsed>=600000;robber.disabled=!unlocked;robber.textContent=unlocked?'Robber — Unlocked':`Robber — ${Math.ceil(Math.max(0,600000-elapsed)/60000)} min playtime left`;}
function selectSkin(color){const choice=[...skinOptions.querySelectorAll('button')].find(button=>button.dataset.color===color);if(choice?.disabled)return;suit.value=color;skinOptions.querySelectorAll('button').forEach(button=>{const selected=button.dataset.color===color;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))})}
skins.forEach(skin=>{const button=document.createElement('button');button.type='button';button.textContent=skin.unlockMs?'Robber — 10 min playtime':`${skin.name} — Free`;button.dataset.color=skin.color;button.dataset.name=skin.name;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>selectSkin(skin.color));skinOptions.append(button)});
suit.addEventListener('input',()=>selectSkin(suit.value));selectSkin(suit.value);
let notificationTimer;
function notify(text){msg.textContent=text;msg.classList.add('visible');clearTimeout(notificationTimer);notificationTimer=setTimeout(()=>msg.classList.remove('visible'),5000)}
// Shared leaderboard using Firebase Realtime Database's REST API.
// Create a database, configure suitable rules, and replace YOUR-PROJECT with
// its project ID. POST records are stored under /scores and shared with players.
const leaderboardApi='https://YOUR-PROJECT-default-rtdb.firebaseio.com/scores.json';
let ludde,obstacles,score,speed,playing=false,last,ground=252,highScore=Number(localStorage.getItem('luddeHighScore')||0),goatShown=false,fireAttack=null,fireCooldown=0;
function getScores(){try{return JSON.parse(localStorage.getItem('luddeScores')||'[]')}catch{return []}}
function renderScores(scores){scoreList.replaceChildren(...scores.slice(0,5).map(item=>{const li=document.createElement('li');li.textContent=typeof item==='number'?String(item):`${item.name}: ${item.score}`;return li}))}
async function showScores(){scoresBox.hidden=false;if(!leaderboardApi||leaderboardApi.includes('YOUR-PROJECT')){renderScores(getScores());leaderboardStatus.textContent='Local scores only — configure your Firebase database URL in the code to share scores.';return}leaderboardStatus.textContent='Loading global leaderboard…';try{const response=await fetch(leaderboardApi);if(!response.ok)throw Error();const data=await response.json();const scores=(Array.isArray(data)?data:Object.values(data||{})).filter(item=>item&&Number.isFinite(Number(item.score))).sort((a,b)=>Number(b.score)-Number(a.score)).slice(0,5);renderScores(scores);leaderboardStatus.textContent='Global top scores'}catch{renderScores(getScores());leaderboardStatus.textContent='Global leaderboard unavailable; showing scores saved on this device.'}}
async function submitScore(value){const name=playerName.value.trim()||'Player';if(!leaderboardApi)return;try{await fetch(leaderboardApi,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score:value})})}catch{}}
function reset(){ludde={x:75,y:ground-42,w:30,h:42,vy:0,jumping:false};obstacles=[];score=0;speed=6;playing=true;last=performance.now();playSessionStart=last;goatShown=false;fireAttack=null;fireCooldown=0;notify('Press Space, ↑, or tap to jump!');restart.hidden=true;scoresBox.hidden=true;updateSkinShop();requestAnimationFrame(loop)}
function jump(){if(!playing)return reset();if(!ludde.jumping){ludde.vy=-13;ludde.jumping=true}}
function addObstacle(){let h=28+Math.random()*28,w=16+Math.random()*18;obstacles.push({x:920,y:ground-h,w,h})}
function drawFlyingCreatures(now){let t=now/650;for(let i=0;i<5;i++){let x=((i*213+t*(28+i*7))%1050)-80,y=48+i*25+Math.sin(t+i)*10,wing=12+Math.sin(t*2+i)*5;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t+i)*.12);ctx.fillStyle=['#a855f7','#06b6d4','#f43f5e','#22c55e','#f97316'][i];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;ctx.beginPath();ctx.ellipse(0,0,15,5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-4,0);ctx.quadraticCurveTo(-18,-wing,-25,-3);ctx.quadraticCurveTo(-13,5,-3,4);ctx.moveTo(4,0);ctx.quadraticCurveTo(18,-wing,25,-3);ctx.quadraticCurveTo(13,5,3,4);ctx.fill();ctx.fillStyle='#fef08a';ctx.fillRect(7,-2,3,3);ctx.restore()}}
function drawGodzilla(now){if(score<50||score>=200)return;let pulse=Math.sin(now/90)*2,baseX=650;ctx.save();ctx.globalAlpha=.96;ctx.fillStyle='#172b25';ctx.strokeStyle='#0b1715';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(baseX-75,ground);ctx.lineTo(baseX-60,175);ctx.lineTo(baseX-45,145);ctx.lineTo(baseX-28,128);ctx.lineTo(baseX-5,112);ctx.lineTo(baseX+18,120);ctx.lineTo(baseX+43,145);ctx.lineTo(baseX+65,165);ctx.lineTo(baseX+82,ground);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#365c43';ctx.beginPath();ctx.arc(baseX-2,117,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#facc15';ctx.fillRect(baseX+10,108,5,5);ctx.fillRect(baseX-13,108,5,5);ctx.fillStyle='#1f3d2b';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(baseX-48+i*18,145+i%2*5);ctx.lineTo(baseX-40+i*18,122+i%2*5);ctx.lineTo(baseX-30+i*18,145+i%2*5);ctx.fill()}ctx.fillStyle='#f97316';ctx.shadowColor='#ef4444';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(baseX+23,125);ctx.quadraticCurveTo(baseX+105,115+pulse,baseX+190,130);ctx.quadraticCurveTo(baseX+115,145+pulse,baseX+23,135);ctx.fill();ctx.fillStyle='#fde047';ctx.beginPath();ctx.moveTo(baseX+28,129);ctx.quadraticCurveTo(baseX+105,124+pulse,baseX+165,131);ctx.quadraticCurveTo(baseX+105,136+pulse,baseX+28,133);ctx.fill();ctx.restore()}
function drawHydra(now){if(score<200)return;let pulse=Math.sin(now/80)*10,baseX=670;ctx.save();ctx.strokeStyle='#dbeafe';ctx.lineWidth=3;ctx.shadowColor='#60a5fa';ctx.shadowBlur=16;for(let i=0;i<5;i++){let x=baseX-55+i*28;ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x-12,190);ctx.lineTo(x+Math.sin(now/120+i)*8,125);ctx.stroke();ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.arc(x+Math.sin(now/120+i)*8,115,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fef08a';ctx.fillRect(x-6+Math.sin(now/120+i)*8,110,4,4);ctx.fillRect(x+5+Math.sin(now/120+i)*8,110,4,4)}ctx.strokeStyle='#e0f2fe';ctx.lineWidth=5;for(let i=0;i<4;i++){let x=60+i*230;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+45,65+pulse);ctx.lineTo(x-20,135);ctx.lineTo(x+35,ground-55);ctx.stroke()}ctx.restore()}
function drawKong(now){if(score<300)return;let x=650,y=ground-115;ctx.save();ctx.fillStyle='#171717';ctx.strokeStyle='#050505';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y+55,58,65,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(x,y-8,43,0,7);ctx.fill();ctx.fillStyle='#facc15';ctx.fillRect(x-20,y-15,8,7);ctx.fillRect(x+14,y-15,8,7);ctx.fillStyle='#292929';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(x-38,y+40);ctx.lineTo(x-85,y+90);ctx.moveTo(x+38,y+40);ctx.lineTo(x+85,y+90);ctx.stroke();ctx.fillStyle='#f2b27b';ctx.beginPath();ctx.arc(x-85,y+90,12,0,7);ctx.arc(x+85,y+90,12,0,7);ctx.fill();ctx.strokeStyle='#dc2626';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x+45,y+12);ctx.lineTo(x+125,y+35+Math.sin(now/100)*5);ctx.stroke();ctx.restore()}
function drawBackground(now){let t=now/1000;ctx.fillStyle='#172033';ctx.fillRect(0,0,900,300);ctx.fillStyle='#263653';for(let i=0;i<9;i++){let x=(i*137-(t*18)%137);ctx.beginPath();ctx.arc(x,65+(i%3)*18,2+(i%2)*2,0,7);ctx.fill()}drawFlyingCreatures(now);drawGodzilla(now);drawHydra(now);drawKong(now);ctx.fillStyle='#334155';for(let i=0;i<8;i++){let x=(i*150-(t*35)%150);ctx.fillRect(x,ground-35-(i%2)*18,70,35+(i%2)*18)}ctx.fillStyle='#fbbf24';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(790,55,24,0,7);ctx.fill();ctx.globalAlpha=1}
function drawLudde(){let c=suit.value;if(score>=210&&score<300){ctx.fillStyle='#dc2626';ctx.fillRect(ludde.x,ludde.y+18,42,17);ctx.fillStyle='#93c5fd';ctx.fillRect(ludde.x+9,ludde.y+8,24,13);ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(ludde.x+8,ludde.y+36,6,0,Math.PI*2);ctx.arc(ludde.x+34,ludde.y+36,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f2b27b';ctx.beginPath();ctx.arc(ludde.x+21,ludde.y+7,8,0,Math.PI*2);ctx.fill();return}ctx.fillStyle=c;ctx.fillRect(ludde.x+7,ludde.y+12,16,25);ctx.fillStyle='#f2b27b';ctx.beginPath();ctx.arc(ludde.x+15,ludde.y+8,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(ludde.x+19,ludde.y+5,3,3);if(hat.value!=='none'){ctx.fillStyle=hat.value==='helmet'?'#f59e0b':c;ctx.fillRect(ludde.x+3,ludde.y-5,24,7);ctx.fillRect(ludde.x+8,ludde.y-10,15,7)}ctx.strokeStyle=c;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ludde.x+10,ludde.y+37);ctx.lineTo(ludde.x+5,ludde.y+42);ctx.moveTo(ludde.x+20,ludde.y+37);ctx.lineTo(ludde.x+26,ludde.y+42);ctx.stroke()}
function drawDino(o){ctx.fillStyle=o.color||'#65a30d';ctx.fillRect(o.x+7,o.y+10,o.w-12,o.h-10);ctx.beginPath();ctx.arc(o.x+7,o.y+9,9,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(o.x+9,o.y+5,2,2);ctx.fillStyle='#84cc16';ctx.fillRect(o.x+2,o.y+o.h-3,7,3)}
function finishPlaySession(){if(!playing)return;playing=false;playtime+=performance.now()-playSessionStart;localStorage.setItem('luddePlaytime',String(playtime));updateSkinShop()}
function gameOver(){finishPlaySession();const finalScore=Math.floor(score),scores=[...getScores(),finalScore].sort((a,b)=>b-a).slice(0,5);localStorage.setItem('luddeScores',JSON.stringify(scores));submitScore(finalScore).finally(showScores);if(finalScore>highScore){highScore=finalScore;localStorage.setItem('luddeHighScore',highScore)}notify('Game over!');restart.textContent='Start game';restart.hidden=false;showScores()}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/16.67,2);last=now;drawBackground(now);ctx.strokeStyle='#64748b';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(900,ground);ctx.stroke();
 ludde.vy+=.65*dt;ludde.y+=ludde.vy*dt;if(ludde.y>=ground-ludde.h){ludde.y=ground-ludde.h;ludde.vy=0;ludde.jumping=false}drawLudde();
 if(score>=50&&score<200){
  fireCooldown-=dt;
  if(!fireAttack&&fireCooldown<=0){fireAttack={x:850,y:ground-30,w:34,h:18};fireCooldown=260;msg.textContent='Godzilla is attacking! Jump over the fire!'}
  if(fireAttack){fireAttack.x-=9*dt;ctx.fillStyle='#f97316';ctx.shadowColor='#ef4444';ctx.shadowBlur=12;ctx.beginPath();ctx.ellipse(fireAttack.x,fireAttack.y+9,fireAttack.w/2,fireAttack.h/2,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(ludde.x<fireAttack.x+fireAttack.w&&ludde.x+ludde.w>fireAttack.x&&ludde.y<fireAttack.y+fireAttack.h&&ludde.y+ludde.h>fireAttack.y)gameOver();if(fireAttack.x+fireAttack.w<0)fireAttack=null}
 }
 if(score>=200)fireAttack=null;
 if(score>=300&&score<500){msg.textContent='King Kong killed the Hydra and launched you with your car!';ctx.fillStyle='#dc2626';ctx.fillRect(610,ground-32,52,22);ctx.fillStyle='#93c5fd';ctx.fillRect(620,ground-48,30,18);ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(620,ground-8,7,0,7);ctx.arc(652,ground-8,7,0,7);ctx.fill();ctx.fillStyle='#facc15';ctx.font='bold 16px Arial';ctx.fillText('KONG!',735,55);}
 if(score>=500){ludde.x=760;ctx.fillStyle='#475569';for(let i=0;i<3;i++){ctx.fillRect(90+i*80,ground-65,45,12);ctx.fillRect(108+i*80,ground-53,9,25);ctx.fillStyle='#ef4444';ctx.fillRect(125+i*80,ground-75,4,12);ctx.fillStyle='#475569'}ctx.fillStyle='#f8fafc';ctx.fillRect(790,ground-95,5,95);ctx.fillRect(770,ground-95,45,25);ctx.fillStyle='#dc2626';ctx.font='bold 14px Arial';ctx.fillText('FINISH',772,ground-77);ctx.fillStyle='#facc15';ctx.font='bold 16px Arial';ctx.fillText('KONG KILLED!',650,45);msg.textContent='Ludde crossed the finish line and won $1,000,000!';finishPlaySession();restart.hidden=false;restart.textContent='Play again';}
 if(score>=210&&score<300)msg.textContent='Car power-up! You are driving through the obstacles!';
 if(!goatShown&&score>highScore){goatShown=true;msg.textContent='You are goated';}
 if(score<300||score>=500){if(!obstacles.length||obstacles.at(-1).x<600&&Math.random()<.025*dt){let type=Math.random();let h=type<.45?28+Math.random()*28:38,w=type<.45?16+Math.random()*18:34;obstacles.push({x:920,y:ground-h,w,h,type:type<.45?'rock':type<.75?'dino':'cactus',color:'#65a30d'})}}for(const o of obstacles){o.x-=speed*dt;if(o.type==='dino')drawDino(o);else{ctx.fillStyle=o.type==='cactus'?'#16a34a':'#a16207';ctx.fillRect(o.x,o.y,o.w,o.h);if(o.type==='cactus'){ctx.fillRect(o.x-7,o.y+14,8,6);ctx.fillRect(o.x+o.w-1,o.y+22,8,6)}}if((score<210||score>=500)&&ludde.x<o.x+o.w&&ludde.x+ludde.w>o.x&&ludde.y<o.y+o.h&&ludde.y+ludde.h>o.y)gameOver()}obstacles=obstacles.filter(o=>o.x+o.w>0);score+=dt*.1;if(score>=500){score=500;speed=0}speed+=.002*dt;scoreEl.textContent=Math.floor(score).toString().padStart(5,'0');requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}});canvas.addEventListener('pointerdown',jump);restart.onclick=reset;setInterval(updateSkinShop,1000);updateSkinShop();showScores();
</script>
</body></html>
